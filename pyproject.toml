[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-sdr-crew"
version = "0.1.0"
description = "Multi-agent outbound copilot on Claude with evals, guardrails and human-in-the-loop approval."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hussain Singapuri" }]
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.7",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10"]
# Only for `make real-redteam` (downloads public datasets as parquet).
real = ["pyarrow>=15"]
# Only for `make train-detector` (fits the injection classifier; the runtime does not need it).
detector = ["pyarrow>=15", "scikit-learn>=1.4"]

[project.scripts]
sdr-crew = "ai_sdr_crew.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_sdr_crew"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "PT018"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
